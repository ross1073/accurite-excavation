[build]
  command = "npm run build"
  publish = "dist"

# Remove trailing slashes to match Astro's trailingSlash: 'never' config
# force = true ensures /page/ always 301s to /page, even when Netlify
# can serve index.html at both paths — prevents Google canonical mismatch
[[redirects]]
  from = "/:splat/"
  to = "/:splat"
  status = 301
  force = true

# Block WP search URLs — _redirects can't match query strings
[[redirects]]
  from = "/"
  to = "/"
  status = 301
  query = {s = ":value"}
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
