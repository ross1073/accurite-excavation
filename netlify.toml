[build]
  command = "npm run build"
  publish = "dist"

# IndexNow verification key — serve as-is, no redirects
[[redirects]]
  from = "/e03de1ac69fc4666a18fe5ec07b68436.txt"
  to = "/e03de1ac69fc4666a18fe5ec07b68436.txt"
  status = 200
  force = true

# Remove trailing slashes to match Astro's trailingSlash: 'never' config.
# force = false because Astro emits /page/index.html, which Netlify serves
# at /page directly. With force = true Netlify canonicalizes the served
# path back to /page/, the rule matches again, and every top-level page
# loops infinitely (bug shipped in d3a266d, reverted 2026-04-17 after
# /about, /contact, /reviews, /services etc. were verified broken live).
# Pretty-URL handling keeps /page/ from indexing separately, so the
# canonical-mismatch motivation for force=true is already handled.
[[redirects]]
  from = "/:splat/"
  to = "/:splat"
  status = 301
  force = false

# Clean up stale /blog/<slug>.md 404s. The blog index linked to post.id
# (which carries the .md extension in Astro 5) from launch until 63a48c3,
# so Googlebot crawled /blog/*.md for months. 301 each to its clean URL.
# Enumerated per-slug because Netlify won't capture a splat/placeholder
# that precedes a literal suffix (/blog/*.md and /blog/:slug.md both fail).
# This is the full historical set; the fixed index emits no new .md URLs.
[[redirects]]
  from = "/blog/avoid-flooding-new-home.md"
  to = "/blog/avoid-flooding-new-home"
  status = 301
[[redirects]]
  from = "/blog/basement-excavation-vs-dig-out.md"
  to = "/blog/basement-excavation-vs-dig-out"
  status = 301
[[redirects]]
  from = "/blog/camp-williams-shooting-range.md"
  to = "/blog/camp-williams-shooting-range"
  status = 301
[[redirects]]
  from = "/blog/evaluate-excavation-subcontractors-utah.md"
  to = "/blog/evaluate-excavation-subcontractors-utah"
  status = 301
[[redirects]]
  from = "/blog/excavation-safety-on-federal-projects.md"
  to = "/blog/excavation-safety-on-federal-projects"
  status = 301
[[redirects]]
  from = "/blog/hill-afb-steam-plant-project.md"
  to = "/blog/hill-afb-steam-plant-project"
  status = 301
[[redirects]]
  from = "/blog/how-much-does-excavation-cost-utah.md"
  to = "/blog/how-much-does-excavation-cost-utah"
  status = 301
[[redirects]]
  from = "/blog/how-to-choose-excavation-contractor-utah.md"
  to = "/blog/how-to-choose-excavation-contractor-utah"
  status = 301
[[redirects]]
  from = "/blog/national-park-service-project.md"
  to = "/blog/national-park-service-project"
  status = 301
[[redirects]]
  from = "/blog/retaining-wall-permit-utah.md"
  to = "/blog/retaining-wall-permit-utah"
  status = 301
[[redirects]]
  from = "/blog/retaining-wall-types-utah-soil.md"
  to = "/blog/retaining-wall-types-utah-soil"
  status = 301
[[redirects]]
  from = "/blog/soil-stabilization-importance.md"
  to = "/blog/soil-stabilization-importance"
  status = 301
[[redirects]]
  from = "/blog/what-is-emod-experience-modification-rate.md"
  to = "/blog/what-is-emod-experience-modification-rate"
  status = 301

# Service slugs that never existed but were linked from four location pages
# (washington-terrace, willard, harrisville, huntsville) since before 2026-08-11.
# The in-page links were repointed on 2026-08-11; these catch anything already
# indexed or linked externally so it lands on the right page instead of the 404.
[[redirects]]
  from = "/services/excavation"
  to = "/services/residential-excavation"
  status = 301
[[redirects]]
  from = "/services/grading-drainage"
  to = "/services/grading-land-clearing"
  status = 301

# Block WP search URLs — _redirects can't match query strings
[[redirects]]
  from = "/"
  to = "/"
  status = 301
  query = {s = ":value"}
  force = true

# Consolidate www host to non-www in a single hop. Netlify's default
# www alias 301s https://www → https://non-www already, but the http://www
# → https://www → https://non-www chain is two hops; the full-URL forms
# below make it one.
[[redirects]]
  from = "https://www.accuriteexcavation.com/*"
  to = "https://accuriteexcavation.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.accuriteexcavation.com/*"
  to = "https://accuriteexcavation.com/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
